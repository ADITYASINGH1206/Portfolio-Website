name: PR Checks

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

jobs:
  validate:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest
    # Only run when:
    # 1. Manually triggered via workflow_dispatch, OR
    # 2. PR review is approved by ADITYASINGH1206 (or repository owner)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'approved' &&
        (github.event.review.user.login == github.repository_owner || github.event.review.user.login == 'ADITYASINGH1206')
      )

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript typecheck
      run: npx tsc --noEmit

    - name: Run ESLint
      run: npm run lint

    - name: Run automated integrity tests
      run: npm test

    - name: Build Next.js app
      run: npm run build

